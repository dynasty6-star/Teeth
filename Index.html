<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Urgent System Message</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a1a; /* Darker for the prank vibe */
            font-family: sans-serif;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 10;
        }

        h1 { color: #333; font-size: 1.4rem; margin-bottom: 30px; }

        .btn-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 60px;
        }

        .btn {
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #yesBtn { background: #4caf50; color: white; }
        #noBtn { background: #f44336; color: white; position: relative; transition: 0.1s; }

        /* The Jump Scare Overlay */
        #scareOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            background-image: url('https://rimmer.github.io/jquery-jumpscare/face.jpg'); /* Standard prank face, change if you want */
            background-size: cover;
            background-position: center;
            display: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <audio id="music"><source src="music.mp3" type="audio/mpeg"></audio>
    <audio id="scream"><source src="scare.mp3" type="audio/mpeg"></audio>

    <div id="scareOverlay"></div>

    <div class="container" id="mainBox">
        <h1 id="header">Is your name 48 teeth Teethklonjay?</h1>
        <div class="btn-wrapper">
            <button class="btn" id="yesBtn" onclick="celebrate()">Yes</button>
            <button class="btn" id="noBtn" onmouseover="moveAndCheck()" ontouchstart="moveAndCheck()">No</button>
        </div>
    </div>

    <script>
        let attempts = 0;

        function moveAndCheck() {
            attempts++;
            
            // If they try to hit "No" 5 times, trigger the scare
            if (attempts > 5) {
                triggerScare();
                return;
            }

            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            
            const padding = 50;
            const w = window.innerWidth - noBtn.offsetWidth - padding;
            const h = window.innerHeight - noBtn.offsetHeight - padding;

            noBtn.style.left = (Math.random() * w + padding/2) + 'px';
            noBtn.style.top = (Math.random() * h + padding/2) + 'px';
        }

        function triggerScare() {
            const overlay = document.getElementById('scareOverlay');
            const scream = document.getElementById('scream');
            
            overlay.style.display = 'block';
            scream.play();

            // Vibrate the phone if supported
            if (navigator.vibrate) navigator.vibrate([500, 110, 500, 110, 450]);

            // Hide scare after 2 seconds so they can actually click Yes
            setTimeout(() => {
                overlay.style.display = 'none';
                attempts = 0; 
            }, 2000);
        }

        function celebrate() {
            document.getElementById('header').innerHTML = "I KNEW IT! 😂🦷<br>You're stuck with me!";
            document.getElementById('noBtn').style.display = 'none';
            document.getElementById('yesBtn').style.display = 'none';
            document.getElementById('music').play();
        }
    </script>
</body>
</html>
